# Codemagic CI — NOVA Deskbot companion
# Repo root contains firmware + app/; Flutter project lives in app/
# Free personal accounts: 500 macOS M2 minutes/month
#
# iOS workflow builds an unsigned IPA for Sideloadly (Windows re-signs with free Apple ID).
# No Apple Developer ($99) certs required for this path.

workflows:
  ios-sideload-test:
    name: iOS Sideload IPA (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: null
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_DIR: app
    scripts:
      - name: Get Flutter packages
        script: |
          cd $APP_DIR
          flutter pub get
      - name: Build iOS (no codesign)
        script: |
          cd $APP_DIR
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -e
          APP_PATH="$APP_DIR/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            # Newer Flutter layouts
            APP_PATH="$(find "$APP_DIR/build/ios" -name 'Runner.app' -type d | head -n1)"
          fi
          echo "Using app: $APP_PATH"
          STAGE="$CM_BUILD_DIR/ipa_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$CM_BUILD_DIR/NOVA-ios-unsigned.ipa" Payload
          ls -lh "$CM_BUILD_DIR/NOVA-ios-unsigned.ipa"
    artifacts:
      - NOVA-ios-unsigned.ipa
      - app/build/ios/iphoneos/*.app

  android-debug-test:
    name: Android Debug APK
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        APP_DIR: app
    scripts:
      - name: Get packages
        script: |
          cd $APP_DIR
          flutter pub get
      - name: Build debug APK
        script: |
          cd $APP_DIR
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/flutter-apk/app-debug.apk
