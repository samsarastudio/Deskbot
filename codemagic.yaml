# Codemagic CI — NOVA Deskbot companion
# Flutter project lives in app/
# Free personal accounts: 500 macOS M2 minutes/month
#
# iOS workflow builds an unsigned IPA for Sideloadly (Windows re-signs with free Apple ID).
# Includes live cloud API + LTX Studio (128×68 × 12 anim frames).

workflows:
  ios-sideload-test:
    name: iOS Sideload IPA (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_DIR: app
        DESKBOT_API_BASE: https://deskbot.inmomentservices.com
    scripts:
      - name: Get Flutter packages
        script: |
          cd $APP_DIR
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd $APP_DIR/ios
          pod install
      - name: Build iOS (no codesign)
        script: |
          cd $APP_DIR
          flutter build ios --release --no-codesign \
            --dart-define=DESKBOT_API_BASE="$DESKBOT_API_BASE"
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -e
          APP_PATH="$APP_DIR/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find "$APP_DIR/build/ios" -name 'Runner.app' -type d | head -n1)"
          fi
          echo "Using app: $APP_PATH"
          STAGE="$CM_BUILD_DIR/ipa_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$CM_BUILD_DIR/NOVA-ios-unsigned.ipa" Payload
          ls -lh "$CM_BUILD_DIR/NOVA-ios-unsigned.ipa"
          # Also keep a versioned copy for artifact clarity
          VER="$(grep '^version:' "$CM_BUILD_DIR/$APP_DIR/pubspec.yaml" | head -1 | awk '{print $2}' | tr -d '"' | tr '+' '-')"
          cp "$CM_BUILD_DIR/NOVA-ios-unsigned.ipa" "$CM_BUILD_DIR/NOVA-ios-${VER}-unsigned.ipa" || true
    artifacts:
      - NOVA-ios-unsigned.ipa
      - NOVA-ios-*-unsigned.ipa

  android-debug-test:
    name: Android Debug APK
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        APP_DIR: app
        DESKBOT_API_BASE: https://deskbot.inmomentservices.com
    scripts:
      - name: Get packages
        script: |
          cd $APP_DIR
          flutter pub get
      - name: Build debug APK
        script: |
          cd $APP_DIR
          flutter build apk --debug \
            --dart-define=DESKBOT_API_BASE="$DESKBOT_API_BASE"
          mkdir -p "$CM_BUILD_DIR"
          cp build/app/outputs/flutter-apk/app-debug.apk "$CM_BUILD_DIR/NOVA-companion.apk"
    artifacts:
      - NOVA-companion.apk
      - app/build/app/outputs/flutter-apk/app-debug.apk
