name: Mobile builds

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: nova-android-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Unsigned/archive-only unless secrets are configured.
      - name: Build iOS (no codesign if secrets missing)
        run: |
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            sed -i '' "s/YOUR_APPLE_TEAM_ID/${{ secrets.APPLE_TEAM_ID }}/" ios/ExportOptions.plist
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          else
            flutter build ios --release --no-codesign
            echo "Built without codesign — add APPLE_TEAM_ID + certs for installable IPA."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-ios-build
          path: |
            app/build/ios/ipa/*.ipa
            app/build/ios/iphoneos/*.app
          if-no-files-found: warn
