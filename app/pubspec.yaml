name: nova_companion
description: NOVA Deskbot BLE companion — cute phone app for discovery, ownership, and auto-reconnect.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_blue_plus: ^1.32.12
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  uuid: ^4.4.2
  collection: ^1.18.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
